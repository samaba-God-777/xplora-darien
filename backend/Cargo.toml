[package]
name = "xplora-darien-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "file-transport", "hostname", "ring", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rust_decimal = { version = "1.43.0", features = ["macros", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros", "rust_decimal"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "fs"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
chrono = "0.4.45"
http-body-util = "0.1.5"
